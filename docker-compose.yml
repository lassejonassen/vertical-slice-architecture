services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vertical_slice_architecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/VerticalSliceArchitecture.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=vertical_slice_architecture;Username=postgres;Password=postgres"
    ports:
      - "5149:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
